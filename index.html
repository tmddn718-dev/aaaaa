<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROAM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* Designbase Template 디자인 토큰 */
  :root {
    --primary: #004fff; --primary-50: #e5edff; --secondary-01: #6eb6ff; --secondary-02: #e7bc3e; --secondary-03: #18283b;
    --gray-10: #17191a; --gray-30: #454a4d; --gray-50: #737b80; --gray-70: #a1adb2; --gray-80: #b8c5cc;
    --gray-90: #dae2e5; --gray-95: #e6eef2; --gray-99: #f0f8fc;
    --success: #27c28a; --success-bg: #e3f7ef; --success-fg: #12805a; --warning: #ffab00; --warning-bg: #fff4d9; --error: #e65c5c; --error-bg: #fdeaea;
    --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 24px; --r-full: 999px;
    --shadow: 0 2px 4px rgba(0,0,0,.1), 0 4px 12px rgba(0,0,0,.1); --shadow-up: 0 -4px 12px rgba(0,0,0,.1); --shadow-3: 0 8px 24px rgba(0,0,0,.1);
    --nav-h: 56px; --safe-b: env(safe-area-inset-bottom, 0px); --sh: 120px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; font: 14px/20px Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--gray-10); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .reduce *, .reduce *::before { animation: none !important; transition: none !important; }

  /* 상단 바 */
  #top { flex: none; height: var(--nav-h); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--gray-95); z-index: 10; }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: .12em; color: var(--primary); }
  #region { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--gray-50); font-weight: 600; }
  #tabs { display: none; gap: 4px; }
  .tab { border: 0; background: none; padding: 8px 16px; border-radius: var(--r-full); font-weight: 700; color: var(--gray-50); }
  .tab.on { background: var(--primary-50); color: var(--primary); }
  .pill { border: 0; background: var(--gray-95); border-radius: var(--r-full); padding: 8px 12px; font-weight: 700; white-space: nowrap; min-height: 36px; }
  .iconbtn { border: 0; background: none; width: 44px; height: 44px; font-size: 20px; border-radius: 50%; }

  main { flex: 1; position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: #e5e3df; }

  /* 모바일: 하단 바텀시트 / 데스크톱·태블릿: 좌측 패널 */
  #panel { position: absolute; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); height: var(--sh); background: #fff; border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-up); z-index: 5; display: flex; flex-direction: column; transition: height .25s; min-height: 0; }
  body[data-sheet=c] { --sh: 132px; } body[data-sheet=h] { --sh: 46%; } body[data-sheet=x] { --sh: 80%; }
  #handle { flex: none; border: 0; background: none; height: 28px; touch-action: none; }
  #handle::after { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--gray-80); margin: 0 auto; }
  #pscroll { flex: 1; overflow-y: auto; padding: 0 16px 16px; min-height: 0; overscroll-behavior: contain; }
  #pfoot { flex: none; padding: 12px 16px; border-top: 1px solid var(--gray-95); background: #fff; }
  #pfoot:empty { display: none; }
  #bnav { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); background: #fff; border-top: 1px solid var(--gray-95); display: flex; z-index: 9; }
  #bnav button { flex: 1; border: 0; background: none; font-weight: 700; color: var(--gray-50); font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; }
  #bnav button span { font-size: 20px; line-height: 24px; }
  #bnav button.on { color: var(--primary); }
  #fabs { position: absolute; right: 12px; bottom: calc(var(--nav-h) + var(--safe-b) + var(--sh) + 12px); z-index: 4; display: flex; flex-direction: column; gap: 8px; transition: bottom .25s; }
  body[data-sheet=x] #fabs { display: none; }
  .fab { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--shadow); font-size: 20px; }

  .page { position: absolute; inset: 0; bottom: calc(var(--nav-h) + var(--safe-b)); background: var(--gray-99); z-index: 8; overflow-y: auto; padding: 20px 16px 32px; }
  .page > div { max-width: 880px; margin: 0 auto; }

  @media (min-width: 768px) {
    :root { --pw: 340px; }
    #bnav { display: none; }
    #tabs { display: flex; }
    #region { flex: none; max-width: 220px; margin-left: 8px; } #top .sp { flex: 1; }
    #panel { top: 0; bottom: 0; right: auto; width: var(--pw); height: auto; border-radius: 0; box-shadow: var(--shadow-3); }
    #handle { display: none; }
    #pscroll { padding-top: 16px; }
    #fabs { bottom: 24px; }
    body[data-sheet=x] #fabs { display: flex; }
    .page { bottom: 0; }
  }
  @media (max-width: 767px) { #top .sp { display: none; } }
  @media (min-width: 1024px) { :root { --pw: 380px; } }

  /* 공통 요소 */
  h2 { margin: 0 0 12px; font-size: 24px; line-height: 30px; }
  h3 { margin: 24px 0 8px; font-size: 18px; line-height: 22px; }
  small, .sub { color: var(--gray-50); font-size: 12px; }
  .btn { width: 100%; min-height: 48px; border: 0; border-radius: var(--r-m); background: var(--primary); color: #fff; font-weight: 700; font-size: 16px; padding: 0 16px; }
  .btn.ghost { background: var(--gray-95); color: var(--gray-10); }
  .btn[disabled], .btn.off { background: var(--gray-90); color: var(--gray-50); }
  .btn.go { animation: pulse 1.4s infinite; background: var(--success); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(39,194,138,.2); } }
  .linkbtn { border: 0; background: none; color: var(--gray-50); text-decoration: underline; padding: 8px; min-height: 36px; }
  .bd { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: var(--r-full); background: var(--gray-95); color: var(--gray-50); white-space: nowrap; }
  .bd-Active { background: var(--primary-50); color: var(--primary); }
  .bd-Nearby, .bd-Completed { background: var(--success-bg); color: var(--success-fg); }
  .bd-Verifying { background: var(--warning-bg); color: #8a5a00; }
  .bd-Unavailable { background: var(--error-bg); color: var(--error); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
  .chip { flex: none; border: 0; background: var(--gray-95); border-radius: var(--r-full); padding: 8px 14px; font-weight: 700; min-height: 36px; }
  .chip.on { background: var(--secondary-03); color: #fff; }
  .empty { text-align: center; padding: 28px 12px; color: var(--gray-50); }
  .empty b { display: block; color: var(--gray-10); font-size: 16px; margin-bottom: 4px; }
  .empty .btn { margin-top: 16px; }
  .box { background: #fff; border-radius: var(--r-l); padding: 16px; }
  form.search { display: flex; background: var(--gray-95); border-radius: var(--r-full); padding: 4px 4px 4px 16px; margin-bottom: 12px; }
  form.search input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; min-width: 0; }
  form.search button { border: 0; background: var(--primary); color: #fff; width: 40px; height: 40px; border-radius: 50%; }

  /* 목록 */
  .rec { background: var(--primary-50); border-radius: var(--r-l); padding: 14px 16px; margin-bottom: 12px; cursor: pointer; }
  .rec b { display: block; font-size: 16px; line-height: 24px; }
  .rec .tag { color: var(--primary); font-weight: 700; font-size: 12px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 12px 8px; border-radius: var(--r-m); cursor: pointer; min-height: 64px; }
  .row:hover { background: var(--gray-99); }
  .row.Completed .rn { color: var(--gray-50); }
  .row.Unavailable { opacity: .55; }
  .ico { flex: none; width: 44px; height: 44px; border-radius: var(--r-m); background: var(--gray-95); display: grid; place-items: center; font-size: 22px; }
  .rb { flex: 1; min-width: 0; }
  .rn { font-weight: 700; font-size: 16px; line-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rm { color: var(--gray-50); font-size: 12px; }
  .rr { text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .xp { font-weight: 800; color: var(--primary); font-size: 12px; }
  .heart { flex: none; border: 0; background: none; width: 44px; height: 44px; font-size: 22px; color: var(--gray-80); border-radius: 50%; }
  .heart.on { color: var(--error); }
  .stepper { display: flex; align-items: center; gap: 4px; background: var(--gray-99); border-radius: var(--r-m); padding: 4px 8px; margin-bottom: 12px; }
  .stepper .sep { color: var(--gray-80); }
  .st { flex: 1; border: 0; background: none; display: flex; align-items: center; gap: 6px; padding: 0 4px; min-height: 44px; font-weight: 700; color: var(--gray-50); white-space: nowrap; }
  .st i { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--gray-80); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 12px; }
  .st.cur { color: var(--gray-10); } .st.cur i { background: var(--primary); }
  .st.done { color: var(--success-fg); } .st.done i { background: var(--success); }
  form.search.route { background: var(--primary-50); }
  .courses { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; margin-bottom: 8px; }
  .ccourse { flex: none; width: 168px; text-align: left; border: 0; background: var(--gray-99); border-radius: var(--r-l); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .ccourse b { font-size: 16px; line-height: 24px; }
  .cconn { margin: 0 0 0 22px; padding: 2px 0 2px 24px; border-left: 2px dotted var(--gray-80); color: var(--gray-50); font-size: 12px; }
  /* 장소 상세: 사진 · 소개 · 추천 이유 · 후기 */
  .gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px 8px; padding: 0 16px; scrollbar-width: none; }
  .gallery img { flex: none; width: 86%; aspect-ratio: 16/10; object-fit: cover; border-radius: var(--r-l); scroll-snap-align: center; background: var(--gray-95); }
  .cap { color: var(--gray-50); font-size: 11px; margin: 0 0 8px; }
  .sec { margin: 20px 0 8px; font-size: 16px; line-height: 22px; font-weight: 700; }
  .intro { margin: 0; color: var(--gray-30); font-size: 14px; line-height: 22px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  .tag { font-size: 12px; font-weight: 700; background: var(--gray-95); color: var(--gray-30); border-radius: var(--r-full); padding: 4px 10px; }
  .tag.p { background: var(--primary-50); color: var(--primary); } .tag.g { background: var(--success-bg); color: var(--success-fg); }
  .why { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .why li { display: flex; gap: 10px; align-items: flex-start; background: var(--gray-99); border-radius: var(--r-m); padding: 10px 12px; }
  .why .wi { font-size: 20px; line-height: 24px; }
  .why b { display: block; font-size: 14px; line-height: 20px; }
  .rev { background: var(--gray-99); border-radius: var(--r-l); padding: 12px; margin-bottom: 8px; }
  .rev .rt { margin: 4px 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .stars { color: var(--warning); letter-spacing: 1px; }
  .kv { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--gray-95); font-size: 14px; }
  .kv:first-of-type { border: 0; } .kv > span:first-child { flex: none; width: 20px; }
  .kv a, .links a { color: var(--primary); font-weight: 700; text-decoration: none; }
  .links { display: flex; gap: 16px; padding-top: 8px; }
  .skel { height: 14px; border-radius: 7px; background: var(--gray-95); margin: 8px 0; }
  .footrow { display: flex; gap: 8px; align-items: center; }
  .footrow .btn { flex: 1; width: auto; }
  .footrow .heart { flex: none; width: 48px; height: 48px; border: 1px solid var(--gray-90); border-radius: var(--r-m); }

  /* 상세 */
  .back { border: 0; background: none; padding: 4px 0 8px; font-weight: 700; color: var(--gray-50); min-height: 36px; }
  .dh { display: flex; gap: 12px; align-items: flex-start; }
  .dh h2 { margin: 0; font-size: 20px; line-height: 26px; }
  .stats { display: flex; gap: 8px; margin: 16px 0; }
  .stats div { flex: 1; background: var(--gray-99); border-radius: var(--r-m); padding: 10px; text-align: center; }
  .stats b { display: block; font-size: 16px; line-height: 22px; }
  .stats small { display: block; }
  .live { border-radius: var(--r-m); padding: 12px 14px; background: var(--primary-50); margin: 12px 0; }
  .live.ok { background: var(--success-bg); } .live.warn { background: var(--warning-bg); }
  .live b { display: block; }
  .hint { padding: 10px 12px; border-radius: var(--r-m); background: var(--gray-99); margin-bottom: 8px; }
  .hint small { display: block; color: var(--primary); font-weight: 700; }
  .cond { color: var(--gray-30); }
  .admin { margin-top: 16px; padding: 12px; border: 1px dashed var(--gray-80); border-radius: var(--r-m); }
  .admin label { display: block; margin: 4px 0; }
  .admin input[type=number] { width: 72px; }

  /* 도감 / 프로필 */
  .prog { display: flex; flex-direction: column; gap: 12px; }
  .bar { height: 8px; border-radius: 4px; background: var(--gray-95); overflow: hidden; margin: 6px 0 2px; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 4px; transition: width .4s; }
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .ccard { background: #fff; border-radius: var(--r-l); padding: 12px; text-align: center; cursor: pointer; border: 2px solid transparent; }
  .ccard .cimg { height: 72px; border-radius: var(--r-m); background: var(--primary-50); display: grid; place-items: center; font-size: 34px; margin-bottom: 8px; }
  .ccard b { display: block; font-size: 14px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ccard.lock .cimg { background: var(--gray-95); filter: grayscale(1); opacity: .7; }
  .ccard.seen .cimg { background: var(--gray-95); }
  .ccard.done .cimg { background: var(--success-bg); }
  .ccard.hid.done { border-color: var(--secondary-02); } .ccard.hid.done .cimg { background: #fff4d1; }
  .lvl { display: flex; gap: 14px; align-items: center; background: var(--primary-50); border-radius: var(--r-l); padding: 16px; }
  .lvl .em { font-size: 44px; } .lvl .t { font-weight: 700; font-size: 18px; line-height: 22px; }
  .grid4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .grid4 div { background: #fff; border-radius: var(--r-l); padding: 12px; } .grid4 b { display: block; font-size: 20px; line-height: 26px; }
  .ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .ach div { background: #fff; border-radius: var(--r-l); padding: 12px 8px; text-align: center; } .ach .ic { font-size: 28px; }
  .ach .lock { opacity: .4; filter: grayscale(1); }
  .ach b { display: block; font-size: 14px; }
  .led { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--gray-95); } .led:first-child { border: 0; }

  /* 모달 */
  #modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .mcard { background: #fff; width: 100%; max-width: 440px; max-height: 90%; overflow-y: auto; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 24px 20px calc(24px + var(--safe-b)); position: relative; }
  .mcard h2 { font-size: 20px; line-height: 26px; }
  .mx { position: absolute; top: 8px; right: 8px; border: 0; background: none; font-size: 20px; width: 44px; height: 44px; }
  .mcard .setrow { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--gray-95); gap: 12px; }
  .mcard input[type=text] { width: 100%; border: 1px solid var(--gray-90); border-radius: var(--r-m); padding: 12px; font-size: 16px; margin: 8px 0 16px; }
  .step { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--gray-95); opacity: 0; animation: rise .45s forwards; }
  .step:first-of-type { border: 0; } .reduce .step { opacity: 1; }
  .step .si { font-size: 28px; width: 40px; text-align: center; }
  .step b { display: block; font-size: 16px; line-height: 22px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (min-width: 768px) { #modal { align-items: center; } .mcard { border-radius: var(--r-xl); } }

  /* 랜딩 */
  #landing { position: fixed; inset: 0; z-index: 30; background: linear-gradient(160deg, var(--secondary-03), #0a2a6e 70%, var(--primary)); color: #fff; display: grid; place-items: center; padding: 24px; overflow-y: auto; }
  .lwrap { max-width: 420px; width: 100%; }
  .brand { font-weight: 800; letter-spacing: .3em; color: var(--secondary-01); }
  #landing h1 { font-size: 36px; line-height: 46px; margin: 8px 0 12px; }
  #landing p { color: var(--gray-90); font-size: 16px; line-height: 24px; margin: 0 0 24px; }
  .vals { list-style: none; padding: 0; margin: 0 0 28px; display: grid; gap: 10px; }
  .vals li { background: rgba(255,255,255,.1); border-radius: var(--r-l); padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
  .vals .vi { font-size: 26px; } .vals b { display: block; }
  .vals small { color: var(--gray-90); }
  #landing .btn { background: #fff; color: var(--primary); }
  #landing form { display: flex; gap: 8px; margin: 16px 0 12px; }
  #landing form input { flex: 1; min-width: 0; border: 0; border-radius: var(--r-m); padding: 12px; font-size: 16px; }
  #landing form button { border: 0; border-radius: var(--r-m); background: rgba(255,255,255,.2); color: #fff; font-weight: 700; padding: 0 16px; min-height: 44px; }
  #landing small { color: var(--gray-80); display: block; }

  #toast { position: fixed; z-index: 50; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 24px); transform: translate(-50%, 10px); background: var(--secondary-03); color: #fff; border-radius: var(--r-l); padding: 12px 20px; max-width: 90%; font-weight: 700; text-align: center; white-space: pre-line; opacity: 0; pointer-events: none; transition: .25s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (min-width: 768px) { #toast { bottom: 24px; left: calc(50% + 190px); } }
</style>
</head>
<body data-sheet="h">

<header id="top">
  <div class="logo">ROAM</div>
  <div id="region">지역을 선택해 주세요</div>
  <div class="sp"></div>
  <nav id="tabs">
    <button class="tab on" data-act="tab" data-id="explore">탐험</button>
    <button class="tab" data-act="tab" data-id="collection">도감</button>
    <button class="tab" data-act="tab" data-id="profile">프로필</button>
  </nav>
  <button class="pill" id="lvChip" data-act="tab" data-id="profile"></button>
  <button class="iconbtn" data-act="settings" aria-label="설정">⚙️</button>
</header>

<main>
  <div id="map"></div>
  <aside id="panel" aria-label="탐험 패널">
    <button id="handle" aria-label="패널 높이 조절"></button>
    <div id="pscroll"></div>
    <div id="pfoot"></div>
  </aside>
  <div id="fabs">
    <button class="fab" data-act="filter" aria-label="필터">⚙︎</button>
    <button class="fab" data-act="locate" aria-label="현재 위치">📍</button>
  </div>
  <section class="page" id="collection" hidden></section>
  <section class="page" id="profile" hidden></section>
  <nav id="bnav">
    <button class="on" data-act="tab" data-id="explore"><span>🧭</span>탐험</button>
    <button data-act="tab" data-id="collection"><span>📖</span>도감</button>
    <button data-act="tab" data-id="profile"><span>👤</span>프로필</button>
  </nav>
</main>

<div id="landing" hidden>
  <div class="lwrap">
    <div class="brand">ROAM</div>
    <h1>도시가<br>게임이 되다</h1>
    <p>내 주변 숨은 명소를 발견하고, 직접 방문해 도감을 채워 보세요.</p>
    <ul class="vals">
      <li><span class="vi">🔭</span><div><b>발견</b><small>몰랐던 주변 명소를 지도에서 찾아요</small></div></li>
      <li><span class="vi">🚶</span><div><b>방문</b><small>도착해서 체크인하면 경험치를 받아요</small></div></li>
      <li><span class="vi">📖</span><div><b>수집</b><small>방문 기록이 나만의 랜드마크 도감이 돼요</small></div></li>
    </ul>
    <button class="btn" data-act="start">내 주변 탐험하기</button>
    <form id="lform"><input id="lq" placeholder="또는 지역 직접 입력 (예: 경복궁)"><button>이동</button></form>
    <small>위치는 방문 인증에만 사용해요. 허용하지 않아도 지도를 둘러볼 수 있어요.</small>
  </div>
</div>

<div id="modal" hidden><div class="mcard" id="mcard"></div></div>
<div id="toast"></div>

<script>
/*
 * ROAM MVP 프로토타입 (PRD v1.0)
 * - 서버(Supabase) 대신 localStorage를 서버 대역으로 사용: serverCheckin()/grant()가 Edge Function 자리.
 * - 운영자 검수 장소 대신 Google Places 결과를 후보로 사용 (히든 스팟도 데모용 자동 선정, ?admin에서 수정).
 */
const FALLBACK = { lat: 37.5665, lng: 126.9780 }; // 위치 거부 시 임시 시작점(서울시청)
const RADIUS = 100;      // 체크인 반경(m) — 초기 가설, 장소별로 운영자가 수정
const ACC_MAX = 50;      // 위치 정확도 기준(m)
const DEMO = location.search.includes('demo');   // 거리·정확도 검사 생략(테스트용)
const ADMIN = location.search.includes('admin'); // 운영자 장소 관리
const XP_VISIT = 100, XP_HIDDEN = 150, XP_REGION = 300;
const LV_XP = [0, 200, 500, 900, 1400];
const LV_TITLE = ['탐험 입문자', '동네 탐험가', '도시 발견자', '도시 모험가', '랜드마크 수집가'];
const FOG_ZOOM = 14; // 이보다 멀리서 보면 안개 생략(셀이 너무 많아져서)
const CAT = {
  museum: { icon: '🏛️', label: '박물관·전시' }, gallery: { icon: '🖼️', label: '미술관' },
  park: { icon: '🌳', label: '공원' }, sight: { icon: '📸', label: '관광 명소' },
};
const STATE_LABEL = { Available: '발견 가능', Active: '진행 중', Nearby: '체크인 가능', Verifying: '인증 중…', Completed: '방문 완료', Unavailable: '참여 불가' };
const HINT2 = { museum: '전시와 이야기가 모여 있는 건물이에요.', gallery: '작품을 만날 수 있는 곳이에요.', park: '나무와 길이 어우러진 열린 공간이에요.', sight: '사진으로 남기고 싶은 풍경이 있는 곳이에요.' };
const SIGNAL_R = [900, 600, 450, 300]; // 힌트를 볼수록 좁아지는 탐색 범위(m)

// ---- 저장소(서버 대역) ----
const KEY = 'roam.v1';
const defaults = () => ({ user: null, saved: {}, quests: {}, ledger: [], collection: {}, lm: {}, cells: {}, regions: {}, hints: {}, ops: {}, attempts: [], processed: {}, onboarded: false,
  settings: { fog: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches, radius: 3000 } });
const S = (() => { try { const d = defaults(), s = JSON.parse(localStorage.getItem(KEY) || '{}'); return Object.assign(d, s, { settings: Object.assign(d.settings, s.settings) }); } catch (e) { return defaults(); } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---- 유틸 ----
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dist = (d) => d < 1000 ? Math.round(d) + 'm' : (d / 1000).toFixed(1) + 'km';
const walkMin = (d) => Math.max(1, Math.round(d / 70)); // 직선거리 기준 약식(분당 70m)
const geo = (a, b) => google.maps.geometry.spherical.computeDistanceBetween(a, b);
const hash = (s) => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const score = (p) => (p.rating || 0) * Math.log10((p.user_ratings_total || 0) + 10);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const fmtDate = (t) => new Date(t).toLocaleDateString('ko-KR');
// 분석 이벤트: 정확한 GPS 좌표는 기록하지 않음
const track = (name, props = {}) => { (window.__roamEvents = window.__roamEvents || []).push({ name, props, t: Date.now() }); console.info('[roam]', name, props); };

// ---- 레벨/XP ----
const totalXp = () => S.ledger.reduce((a, x) => a + x.xp, 0);
const lvTh = (n) => { if (n < LV_XP.length) return LV_XP[n]; let t = LV_XP[4], step = 600; for (let i = 5; i <= n; i++) { t += step; step += 100; } return t; };
const levelOf = (xp) => { let n = 0; while (xp >= lvTh(n + 1)) n++; return n; };
const lvTitle = (n) => LV_TITLE[n] || '전설의 탐험가';

// ---- 안개 격자 (고정 지리 셀 ~250m, 줌과 무관한 셀 ID) ----
const D_LAT = 250 / 111320, D_LNG = D_LAT / Math.cos(37 * Math.PI / 180); // ponytail: 한반도 위도 기준 고정 경도폭, 다른 위도에선 셀이 찌그러짐
const cellId = (lat, lng) => Math.floor(lat / D_LAT) + '_' + Math.floor(lng / D_LNG);
const cellRect = (i, j) => ({ s: i * D_LAT, n: (i + 1) * D_LAT, w: j * D_LNG, e: (j + 1) * D_LNG });

// ---- 상태 ----
let routeLine, plan = null, selId = null; // plan: 가는 길 명소 검색 결과, selId: 선택한 장소
let map, places, directions, geocoder, meMarker, accCircle, fog, fogEdges = [], markers = new Map(), signals = new Map();
let LM = new Map(), center = null, curRegion = '', pos = null, real = false, watching = false;
let tab = 'explore', view = { name: 'list' }, filt = 'all', cfilt = 'all', verifying = null, loadRun = 0, loadErr = '', loading = false, toastTimer, afterLogin = null, fogTimer;

const lm = (id) => LM.get(id) || S.lm[id];
const ops = (id) => S.ops[id] || {};
const isClosed = (id) => !!(lm(id) && lm(id).closed) || !!ops(id).inactive;
const isHidden = (id) => (ops(id).hidden !== undefined ? ops(id).hidden : !!lm(id).hidden);
const done = (id) => !!(S.quests[id] && S.quests[id].status === 'completed');
const radiusOf = (id) => ops(id).radius || RADIUS;
const hintN = (id) => S.hints[id] || 0;
const xpOf = (id) => isHidden(id) ? XP_HIDDEN : XP_VISIT;
const from = () => (real && pos) ? pos : center;
const distFromUser = (id) => geo(from(), (isHidden(id) && !done(id) && lm(id).signal) ? lm(id).signal : lm(id));
const doneCount = () => Object.values(S.quests).filter((q) => q.status === 'completed').length;
const doneHidden = () => Object.keys(S.quests).filter((id) => done(id) && S.lm[id] && isHidden(id)).length;
const inRange = (id) => DEMO || (real && pos && geo(pos, lm(id)) <= radiusOf(id));
const accOk = () => DEMO || (pos && pos.acc <= ACC_MAX);
function qstate(id) {
  if (done(id)) return 'Completed';
  if (isClosed(id)) return 'Unavailable';
  if (verifying === id) return 'Verifying';
  const q = S.quests[id];
  if (q && q.status === 'active') return (inRange(id) && accOk()) ? 'Nearby' : 'Active';
  return 'Available';
}

// ---- 히든 스팟: 실제 좌표 대신 흔들린 중심 + 탐색 범위만 노출 ----
function signalOf(L) {
  const h = hash(L.id), ang = (h % 360) * Math.PI / 180, off = 50 + (h >> 8) % 100; // 중심 오차 50~150m < 최소 반경 300m
  return { lat: L.lat + off * Math.cos(ang) / 111320, lng: L.lng + off * Math.sin(ang) / (111320 * Math.cos(L.lat * Math.PI / 180)) };
}
const hintsFor = (L) => [`${L.region} 일대에 오래 기억할 만한 장소가 숨어 있어요.`, HINT2[L.catKey] || HINT2.sight, '탐색 범위가 지도에 표시됐어요. 그 안에서 찾아보세요.'];
// ponytail: 운영자 등록 목록 대신 데모용 자동 선정(5곳 중 1곳 꼴). ?admin에서 장소별로 켜고 끌 수 있음.
const autoHidden = (p) => hash(p.place_id) % 5 === 0 && (p.rating || 0) >= 4 && (p.user_ratings_total || 0) >= 20;

// =====================================================================
// 지도 초기화
// =====================================================================
function mapFail() {
  $('pscroll').innerHTML = `<div class="empty"><b>지도를 불러오지 못했어요</b>네트워크나 지도 설정을 확인한 뒤 다시 시도해 주세요.<button class="btn" onclick="location.reload()">다시 시도</button></div>`;
  $('landing').hidden = true;
}
window.gm_authFailure = mapFail;

function initMap() {
  map = new google.maps.Map($('map'), {
    center: FALLBACK, zoom: 12, mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
    zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
    styles: [
      { featureType: 'all', elementType: 'labels.text', stylers: [{ color: '#878787' }] },
      { featureType: 'all', elementType: 'labels.text.stroke', stylers: [{ visibility: 'off' }] },
      { featureType: 'landscape', elementType: 'all', stylers: [{ color: '#f9f5ed' }] },
      { featureType: 'road.highway', elementType: 'all', stylers: [{ color: '#f5f5f5' }] },
      { featureType: 'road.highway', elementType: 'geometry.stroke', stylers: [{ color: '#c9c9c9' }] },
      { featureType: 'water', elementType: 'all', stylers: [{ color: '#aee0f4' }] },
    ],
  });
  places = new google.maps.places.PlacesService(map);
  directions = new google.maps.DirectionsService();
  geocoder = new google.maps.Geocoder();
  routeLine = new google.maps.Polyline({ map, strokeColor: '#004fff', strokeWeight: 5, strokeOpacity: .9, clickable: false });
  map.addListener('idle', () => { clearTimeout(fogTimer); fogTimer = setTimeout(drawFog, 150); });
  track('map_viewed');

  document.body.classList.toggle('reduce', !!S.settings.reduce);
  bindUi();
  renderAll();
  if (!S.onboarded) $('landing').hidden = false;
  // 이미 위치를 허용한 사용자는 바로 시작 (새로 요청하지는 않음)
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then((r) => { if (r.state === 'granted') { $('landing').hidden = true; S.onboarded = true; locate(); } }).catch(() => {});
  }
}

// =====================================================================
// 위치
// =====================================================================
function setPos(p) {
  pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
  real = true;
  if (!meMarker) {
    meMarker = new google.maps.Marker({ map, title: '내 위치', zIndex: 999, clickable: false,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: '#004fff', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3 } });
    accCircle = new google.maps.Circle({ map, strokeWeight: 0, fillColor: '#004fff', fillOpacity: .1, clickable: false });
  }
  meMarker.setPosition(pos); accCircle.setCenter(pos); accCircle.setRadius(pos.acc);
}

function locate(keep) { // keep: 지도 중심은 그대로 두고 내 위치만 갱신
  return new Promise((resolve) => {
    if (!navigator.geolocation) { track('location_permission_result', { result: 'unavailable' }); useFallback(); return resolve(); }
    navigator.geolocation.getCurrentPosition((p) => {
      track('location_permission_result', { result: 'granted' });
      setPos(p); if (!keep) setCenter({ lat: pos.lat, lng: pos.lng });
      if (!watching) { watching = true; navigator.geolocation.watchPosition((q) => { setPos(q); renderPanel(); }, () => {}, { enableHighAccuracy: true, maximumAge: 5000 }); }
      resolve();
    }, (err) => {
      track('location_permission_result', { result: err.code === 1 ? 'denied' : 'error' });
      if (!keep) toast('위치를 확인할 수 없어요\n지역을 검색해서 지도를 둘러볼 수 있어요. 체크인에는 위치 확인이 필요해요.');
      if (!center) useFallback();
      resolve();
    }, { enableHighAccuracy: true, timeout: 10000 });
  });
}
const useFallback = () => setCenter(FALLBACK);

// ---- 위치 인증 게이트 + 첫 방문 3단계 ----
const permState = () => (navigator.permissions && navigator.permissions.query)
  ? navigator.permissions.query({ name: 'geolocation' }).then((r) => r.state).catch(() => 'unknown') : Promise.resolve('unknown');

// 체크인에 위치가 필요한데 없을 때 띄우는 안내. 차단 상태면 다시 묻지 못하니 브라우저 설정 방법을 알려줘요.
async function gateModal(failed) {
  const denied = (await permState()) === 'denied' || failed;
  modal(`<h2>📍 위치 인증이 필요해요</h2>
    <p class="sub">${denied
      ? '브라우저에서 위치 권한이 차단돼 있어요. 주소창 왼쪽 자물쇠 → 사이트 설정 → 위치를 "허용"으로 바꾼 뒤 새로고침해 주세요.'
      : '방문 체크인은 지금 있는 곳을 확인해야 해요. 위치는 인증 순간에만 쓰고 좌표는 저장하지 않아요. 허용하지 않아도 지도 탐색은 계속할 수 있어요.'}</p>
    ${window.isSecureContext ? '' : '<p class="sub">⚠️ 이 페이지는 보안 연결(https/localhost)이 아니라 위치를 쓸 수 없을 수 있어요.</p>'}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">
      <button class="btn ghost" data-act="close">닫기</button>
      ${denied ? '<button class="btn" onclick="location.reload()">새로고침</button>' : '<button class="btn" data-act="gateGo">지금 인증하기</button>'}</div>`);
}

function gateGo() {
  locate(true).then(() => {
    if (real) { closeModal(); toast('위치를 확인했어요 ✅'); renderAll(); } else gateModal(true);
  });
}

function stepperHTML() {
  if (doneCount() > 0) return ''; // 첫 체크인을 마치면 사라져요
  const steps = [['닉네임', !!S.user], ['위치 허용', real || DEMO], ['첫 체크인', false]];
  const cur = steps.findIndex((s) => !s[1]);
  return `<div class="stepper">${steps.map((s, i) => `<button class="st ${s[1] ? 'done' : i === cur ? 'cur' : ''}" data-act="step" data-id="${i + 1}"><i>${s[1] ? '✓' : i + 1}</i>${s[0]}</button>`).join('<span class="sep">›</span>')}</div>`;
}

// ---- 장소 상세: 소개 · 추천 이유 · 방문자 후기 ----
// Places 상세는 메모리에만 두고 저장하지 않아요(구글 장소 데이터 저장 정책). 소개는 구글 제공 문구가 없으면 자체 문구로 대신해요.
const DET = new Map();
function loadDetails(id) {
  if (DET.has(id) || !places) return;
  DET.set(id, { loading: true });
  const finish = (p) => { DET.set(id, p ? { p } : { err: true }); if (view.name === 'detail' && view.id === id) renderPanel(); };
  const base = ['name', 'formatted_address', 'rating', 'user_ratings_total', 'reviews', 'opening_hours', 'utc_offset_minutes', 'photos', 'website', 'url'];
  places.getDetails({ placeId: id, language: 'ko', fields: [...base, 'editorial_summary'] }, (p, st) => {
    if (st === 'OK') return finish(p);
    // editorial_summary를 못 쓰는 환경이면 나머지 필드만 다시 요청
    places.getDetails({ placeId: id, language: 'ko', fields: base }, (p2, st2) => finish(st2 === 'OK' ? p2 : null));
  });
}

const scoreL = (L) => (L.rating || 0) * Math.log10((L.total || 0) + 10);
function rankInfo(id) {
  const arr = [...LM.values()].filter((L) => !isClosed(L.id) && !isHidden(L.id)).sort((a, b) => scoreL(b) - scoreL(a));
  const i = arr.findIndex((L) => L.id === id);
  return i < 0 ? null : { rank: i + 1, total: arr.length };
}

// 가고 싶게 만드는 근거: 실제 데이터(평점·거리·보상·해금·도감·코스)에서만 만들어요
function reasonsOf(id) {
  const L = lm(id), out = [], d = distFromUser(id), r = rankInfo(id);
  if (L.rating) out.push(['⭐', `평점 ${L.rating} · 리뷰 ${(L.total || 0).toLocaleString()}개`, r ? `주변 명소 ${r.total}곳 중 인기 ${r.rank}위` : '많은 방문자가 남긴 평가예요']);
  out.push(['🚶', d < 500 ? '바로 근처에 있어요' : `도보 약 ${walkMin(d)}분 거리`, `${real ? '내 위치' : '지도 중심'}에서 ${dist(d)}`]);
  if (!done(id)) {
    const locked = !S.cells[cellId(L.lat, L.lng)];
    out.push(locked ? ['🗺️', '아직 안개에 가려진 구역이에요', `방문하면 이 구역이 열리고 +${xpOf(id)}XP를 받아요`] : ['🎯', `첫 방문 +${xpOf(id)}XP`, '이미 열린 구역이지만 이 장소는 처음이에요']);
    const reg = S.regions[L.region];
    if (reg && reg.targets.includes(id)) {
      const left = reg.targets.filter((t) => !done(t)).length;
      out.push(['📖', `${L.region} 도감 ${reg.targets.length - left}/${reg.targets.length}`, left === 1 ? `이곳이 마지막 한 곳이에요! 완성하면 +${XP_REGION}XP` : `${left}곳이 남았어요`]);
    }
  }
  const c = buildCourses().find((x) => x.ids.includes(id));
  if (c) out.push([c.icon, `'${c.label}' 코스의 ${c.ids.indexOf(id) + 1}번째`, `${c.ids.length}곳을 이어서 걸을 수 있어요`]);
  return out;
}

function introHTML(id) {
  const L = lm(id), D = DET.get(id), p = D && D.p;
  const blurb = { museum: '전시와 이야기를 천천히 둘러보기 좋은 곳이에요.', gallery: '작품을 감상하며 쉬어 가기 좋은 곳이에요.', park: '걷고 쉬며 머리를 식히기 좋은 열린 공간이에요.', sight: '사진으로 남기고 싶은 풍경과 이야기가 있는 곳이에요.' }[L.catKey];
  const summary = p && p.editorial_summary && p.editorial_summary.overview;
  let open = '';
  try { const o = p && p.opening_hours && p.opening_hours.isOpen(); if (o === true) open = '<span class="tag g">지금 영업 중</span>'; else if (o === false) open = '<span class="tag">지금은 닫았어요</span>'; } catch (e) {}
  const locked = !done(id) && !S.cells[cellId(L.lat, L.lng)];
  return `<div class="tags"><span class="tag">${CAT[L.catKey].icon} ${CAT[L.catKey].label}</span>${open}${locked ? '<span class="tag p">새 구역 해금</span>' : ''}</div>
    <div class="sec">장소 소개</div>
    <p class="intro">${esc(summary || `${L.region}에 있는 ${CAT[L.catKey].label}이에요. ${blurb}`)}</p>${summary ? '<small>Google 제공 소개</small>' : ''}
    <div class="sec">이런 점이 좋아요</div>
    <ul class="why">${reasonsOf(id).map((r) => `<li><span class="wi">${r[0]}</span><div><b>${esc(r[1])}</b><small>${esc(r[2])}</small></div></li>`).join('')}</ul>`;
}

function photosHTML(id) {
  const D = DET.get(id);
  if (!D) return '';

// ---- 가는 길 명소 · 테마 코스 ----
// 코스는 운영자 큐레이션이 아니라 불러온 명소를 가까운 순으로 이어 붙인 자동 구성이에요(히든 스팟 제외).
const THEMES = [
  { key: 'culture', icon: '🏛️', label: '문화 산책', cats: ['museum', 'gallery', 'sight'], max: 5 },
  { key: 'park', icon: '🌳', label: '공원 산책', cats: ['park', 'sight'], max: 4 },
  { key: 'exhibit', icon: '🖼️', label: '전시 투어', cats: ['museum', 'gallery'], max: 4 },
];

function buildCourses() {
  const out = [];
  if (!from()) return out;
  THEMES.forEach((t) => {
    const pool = [...LM.values()].filter((L) => t.cats.includes(L.catKey) && !isClosed(L.id) && !isHidden(L.id));
    if (pool.length < 3) return;
    let cur = pool.slice().sort((a, b) => geo(from(), a) - geo(from(), b))[0];
    const chain = [cur];
    while (chain.length < t.max) { // 직전 장소에서 가장 가까운 곳, 1.5km 넘으면 거기서 끝
      const rest = pool.filter((L) => !chain.includes(L)).sort((a, b) => geo(cur, a) - geo(cur, b));
      if (!rest.length || geo(cur, rest[0]) > 1500) break;
      cur = rest[0]; chain.push(cur);
    }
    if (chain.length < 3) return;
    const legs = chain.slice(1).map((L, i) => geo(chain[i], L));
    out.push({ key: t.key, icon: t.icon, label: t.label, ids: chain.map((L) => L.id), legs, min: walkMin(legs.reduce((a, b) => a + b, 0)) });
  });
  return out;
}
const courseOf = (key) => buildCourses().find((c) => c.key === key);

function coursesHTML() {
  const cs = buildCourses();
  if (!cs.length) return '';
  return `<div class="sub" style="font-weight:700;margin:4px 0 8px">테마 코스</div><div class="courses">${cs.map((c) => {
    const d = c.ids.filter(done).length;
    return `<button class="ccourse" data-act="course" data-id="${c.key}"><span style="font-size:24px">${c.icon}</span><b>${c.label}</b><small>${c.ids.length}곳 · 도보 약 ${c.min}분</small><div class="bar"><i style="width:${Math.round(d / c.ids.length * 100)}%"></i></div><small>${d}/${c.ids.length}곳 방문</small></button>`;
  }).join('')}</div>`;
}

function courseHTML(c) {

// 목적지까지 도보 경로를 그리고, 경로에서 350m(도보 5분) 안에 있는 명소를 지나는 순서대로 추천
async function planRoute(q) {
  if (!q.trim()) return;
  if (!from()) return toast('먼저 시작 위치를 정해 주세요');
  const dest = await new Promise((ok) => places.textSearch({ query: q, location: center, radius: 20000 }, (r, s) => ok(s === 'OK' && r[0] && r[0].geometry ? r[0] : null)));
  if (!dest) return toast('목적지를 찾지 못했어요\n다른 이름으로 검색해 주세요');
  const a = from(), b = dest.geometry.location;
  let path;
  try { path = (await directions.route({ origin: a, destination: b, travelMode: 'WALKING' })).routes[0].overview_path; }
  catch (e) { path = [new google.maps.LatLng(a.lat, a.lng), b]; } // 경로 API 실패 시 직선
  const sp = google.maps.geometry.spherical, dense = [];
  for (let i = 0; i < path.length - 1; i++) {
    const n = Math.max(1, Math.ceil(geo(path[i], path[i + 1]) / 50));
    for (let k = 0; k < n; k++) dense.push(sp.interpolate(path[i], path[i + 1], k / n));
  }
  dense.push(path[path.length - 1]);
  const picks = [];
  LM.forEach((L) => {
    if (isClosed(L.id) || isHidden(L.id)) return; // 히든 스팟은 경로 추천에서도 숨김
    let best = Infinity, at = 0;
    dense.forEach((p, i) => { const d = geo(p, L); if (d < best) { best = d; at = i; } });
    if (best <= 350) picks.push({ id: L.id, off: best, at });
  });
  picks.sort((x, y) => x.at - y.at);
  plan = { name: dest.name, total: sp.computeLength(path), picks };
  routeLine.setPath(path);
  fit([...path, a].map((p) => (p.lat && typeof p.lat === 'function') ? p : new google.maps.LatLng(p.lat, p.lng)));
  if (innerWidth < 768) setSheet('h');
  renderPanel();
}

async function regionName(c) {
  try {

    for (const t of ['sublocality_level_1', 'locality', 'administrative_area_level_2', 'administrative_area_level_1']) {

    }

  return '탐험 구역 ' + Math.round(c.lat * 30) + '·' + Math.round(c.lng * 30);

// =====================================================================
// 랜드마크 로드
// =====================================================================
const nearby = (req) => new Promise((ok) => places.nearbySearch(req, (r, s) => ok({ r: s === 'OK' ? r : [], s })));
const catOf = (p) => { const t = p.types || []; return t.includes('museum') ? 'museum' : t.includes('art_gallery') ? 'gallery' : t.includes('park') ? 'park' : 'sight'; };

async function loadLandmarks() {
  const my = ++loadRun; loading = true; loadErr = ''; plan = null; routeLine.setPath([]); renderPanel();
  let all = [], bad = 0;
  for (const type of ['tourist_attraction', 'museum', 'art_gallery', 'park']) {
    const { r, s } = await nearby({ location: center, radius: S.settings.radius, type });
    if (s !== 'OK' && s !== 'ZERO_RESULTS') bad++;
    all = all.concat(r);
  }
  if (my !== loadRun) return;
  loading = false;
  if (bad === 4) loadErr = 'api';
  const seen = new Set();
  const list = all.filter((p) => p.geometry && (p.rating || 0) >= 3.5 && !seen.has(p.place_id) && seen.add(p.place_id)).sort((a, b) => score(b) - score(a)).slice(0, 40);
  LM = new Map();
  list.forEach((p) => {
    const old = S.lm[p.place_id];
    const L = { id: p.place_id, name: p.name, catKey: catOf(p), lat: p.geometry.location.lat(), lng: p.geometry.location.lng(),
      rating: p.rating, total: p.user_ratings_total || 0, vicinity: p.vicinity || '',
      hidden: old ? old.hidden : autoHidden(p), closed: ['CLOSED_PERMANENTLY', 'CLOSED_TEMPORARILY'].includes(p.business_status), region: old ? old.region : curRegion };
    LM.set(L.id, L); S.lm[L.id] = L;
  });
  // 지역 도감의 수집 대상은 처음 열 때 고정 (실시간 검색 결과 전체를 분모로 쓰지 않음)
  if (!S.regions[curRegion] && list.length) {
    S.regions[curRegion] = { targets: list.filter((p) => !S.lm[p.place_id].closed).slice(0, 8).map((p) => p.place_id), bonus: false };
  }
  save();
  drawMarkers(); drawFog(); renderAll();
  const pts = [...LM.values()].filter((L) => !isClosed(L.id)).slice(0, 8).map((L) => (isHidden(L.id) && L.signal) ? L.signal : L);
  if (pts.length > 1) fit([center, ...pts]);
}

function fit(points) {
  const b = new google.maps.LatLngBounds();
  points.forEach((p) => b.extend(p));
  const wide = innerWidth >= 768;
  map.fitBounds(b, { top: 60, right: 60, left: wide ? 400 : 40, bottom: wide ? 60 : innerHeight * 0.5 });
  google.maps.event.addListenerOnce(map, 'idle', () => { if (map.getZoom() > 17) map.setZoom(17); });
}

// =====================================================================
// 마커 · 안개
// =====================================================================
// 목록 썸네일과 같은 모양(둥근 타일 + 이모지)의 지도 마커. 방문 완료=초록 테두리+✓, 히든=금색, 선택=파란 테두리·확대
const iconCache = new Map();
function pinIcon(emoji, o = {}) {
  const key = emoji + (o.sel ? 's' : '') + (o.done ? 'd' : '') + (o.hidden ? 'h' : '');
  if (iconCache.has(key)) return iconCache.get(key);
  const t = o.sel ? 54 : 44, w = t + 8, h = t + 16, c = t / 2;
  const stroke = o.sel ? '#004fff' : o.hidden ? '#e7bc3e' : o.done ? '#27c28a' : '#ffffff';
  const fill = o.done ? '#e3f7ef' : o.hidden ? '#fff4d1' : '#e6eef2';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".28"/></filter></defs>
    <g transform="translate(4 3)" filter="url(#s)"><path d="M${c - 7} ${t - 3}L${c} ${t + 6}L${c + 7} ${t - 3}Z" fill="${stroke}"/>
    <rect x="1.5" y="1.5" width="${t - 3}" height="${t - 3}" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="3"/></g>
    <text x="${c + 4}" y="${3 + c + t * 0.175}" font-size="${t * 0.5}" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">${emoji}</text>
    ${o.done ? `<circle cx="${t + 1}" cy="8" r="8" fill="#27c28a" stroke="#fff" stroke-width="2"/><path d="M${t - 2.5} 8.2l2.4 2.4 4-4.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}</svg>`;
  const icon = { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), scaledSize: new google.maps.Size(w, h), anchor: new google.maps.Point(w / 2, t + 9) };
  iconCache.set(key, icon);
  return icon;
}

function refreshMarkerIcons() {
  markers.forEach((m, id) => { m.setIcon(pinIcon(CAT[lm(id).catKey].icon, { done: done(id), sel: id === selId })); m.setZIndex(id === selId ? 100 : 1); });
  signals.forEach((s, id) => { s.marker.setIcon(pinIcon('❓', { hidden: true, sel: id === selId })); s.marker.setZIndex(id === selId ? 100 : 1); });
}

function drawMarkers() {
  markers.forEach((m) => m.setMap(null)); markers.clear();
  signals.forEach((s) => { s.circle.setMap(null); s.marker.setMap(null); }); signals.clear();
  LM.forEach((L) => {
    if (isClosed(L.id)) return;
    if (isHidden(L.id) && !done(L.id)) {
      L.signal = L.signal || signalOf(L);
      const circle = new google.maps.Circle({ map, center: L.signal, radius: SIGNAL_R[hintN(L.id)], strokeColor: '#e7bc3e', strokeOpacity: .9, strokeWeight: 2, fillColor: '#e7bc3e', fillOpacity: .12, clickable: false });
      const marker = new google.maps.Marker({ map, position: L.signal, title: '히든 스팟 신호', icon: pinIcon('❓', { hidden: true, sel: selId === L.id }) });
      marker.addListener('click', () => selectLm(L.id));
      signals.set(L.id, { circle, marker });
      return;
    }
    const m = new google.maps.Marker({ map, position: { lat: L.lat, lng: L.lng }, title: L.name, icon: pinIcon(CAT[L.catKey].icon, { done: done(L.id), sel: selId === L.id }) });
    m.addListener('click', () => selectLm(L.id));
    markers.set(L.id, m);
  });
}

// 방문으로 해금한 셀은 구멍으로 뚫고, 나머지는 반투명 안개 (시각 표현만, 해금 이력엔 영향 없음)
function drawFog() {
  if (!map) return;
  if (fog) { fog.setMap(null); fog = null; }
  fogEdges.forEach((r) => r.setMap(null)); fogEdges = [];
  const b = map.getBounds();
  if (!S.settings.fog || !b || map.getZoom() < FOG_ZOOM) return;
  const ne = b.getNorthEast(), sw = b.getSouthWest(), dl = ne.lat() - sw.lat(), dg = ne.lng() - sw.lng();
  const N = Math.min(85, ne.lat() + dl), Sx = Math.max(-85, sw.lat() - dl), E = ne.lng() + dg, W = sw.lng() - dg;
  const outer = [{ lat: N, lng: W }, { lat: N, lng: E }, { lat: Sx, lng: E }, { lat: Sx, lng: W }];
  const holes = [];
  Object.keys(S.cells).forEach((id) => {
    const [i, j] = id.split('_').map(Number), r = cellRect(i, j);
    if (r.n < Sx || r.s > N || r.e < W || r.w > E) return;
    holes.push([{ lat: r.n, lng: r.w }, { lat: r.s, lng: r.w }, { lat: r.s, lng: r.e }, { lat: r.n, lng: r.e }]); // 바깥과 반대 방향
  });
  fog = new google.maps.Polygon({ map, paths: [outer, ...holes], strokeWeight: 0, fillColor: '#18283b', fillOpacity: .42, clickable: false, zIndex: 1 });
  const activeCells = new Set(Object.keys(S.quests).filter((id) => S.quests[id].status === 'active' && S.lm[id]).map((id) => cellId(S.lm[id].lat, S.lm[id].lng)));
  const explorable = new Set();
  LM.forEach((L) => { if (!done(L.id) && !isClosed(L.id) && !isHidden(L.id)) explorable.add(cellId(L.lat, L.lng)); }); // 히든 스팟 셀은 단서를 주지 않음
  explorable.forEach((id) => {
    if (S.cells[id]) return;
    const [i, j] = id.split('_').map(Number), r = cellRect(i, j), act = activeCells.has(id);
    fogEdges.push(new google.maps.Rectangle({ map, bounds: { north: r.n, south: r.s, east: r.e, west: r.w }, clickable: false, zIndex: 2,
      strokeColor: act ? '#e7bc3e' : '#004fff', strokeOpacity: act ? 1 : .6, strokeWeight: act ? 3 : 2, fillColor: '#e7bc3e', fillOpacity: act ? .18 : 0 }));
  });
}

function selectLm(id) {
  const L = lm(id);
  if (!L) return;
  view = { name: 'detail', id };
  selId = id; refreshMarkerIcons();
  if (!(isHidden(id) && !done(id))) loadDetails(id); // 히든 스팟은 발견 전까지 정체를 가려요
  S.collection[id] = S.collection[id] || {};
  if (!S.collection[id].discoveredAt) S.collection[id].discoveredAt = Date.now();
  save();
  track('landmark_selected', { hidden: !!isHidden(id) });
  if (tab !== 'explore') setTab('explore');
  const c = (isHidden(id) && !done(id) && L.signal) ? L.signal : L;
  map.panTo({ lat: c.lat, lng: c.lng });
  if (innerWidth < 768) setSheet('h');
  renderPanel();
}

function needLogin(fn) {
  if (S.user) return fn();
  afterLogin = fn;
  modal(`<h2>닉네임을 정해 주세요</h2><p class="sub">퀘스트 진행과 도감 저장을 위해 필요해요. (프로토타입에서는 이 브라우저에만 저장돼요)</p>
    <form id="loginform"><input type="text" id="nick" maxlength="12" placeholder="예: 로머" autocomplete="off"><button class="btn">시작하기</button></form>`);
  setTimeout(() => $('nick') && $('nick').focus(), 50);
}

function startQuest(id) {
  needLogin(() => {
    if (qstate(id) !== 'Available') return;
    S.quests[id] = { status: 'active', startedAt: Date.now() }; save();
    track('quest_started', { hidden: !!isHidden(id) });
    drawFog(); renderAll();
    toast(isHidden(id) ? '탐색을 시작했어요\n힌트를 보고 범위 안으로 이동해 보세요' : '퀘스트를 시작했어요\n장소 근처에 도착하면 체크인할 수 있어요');
  });
}

function cancelQuest(id) {
  if (S.quests[id] && S.quests[id].status === 'active') { delete S.quests[id]; save(); drawFog(); renderAll(); }
}

function revealHint(id) {
  if (hintN(id) >= 3) return;
  S.hints[id] = hintN(id) + 1; save();
  track('hidden_hint_viewed', { order: S.hints[id] });
  const s = signals.get(id);
  if (s) s.circle.setRadius(SIGNAL_R[S.hints[id]]);
  renderPanel();
}

async function checkin(id) {
  if (verifying || qstate(id) === 'Completed') return;
  if (!real && !DEMO) { track('checkin_failed', { reason: 'no_location' }); return gateModal(); }
  track('checkin_attempted', { accuracy: pos ? Math.round(pos.acc) : null });
  verifying = id; renderPanel();
  const d = DEMO ? 0 : geo(pos, lm(id));
  const res = await serverCheckin({ requestId: uid(), id, dist: d, acc: DEMO ? 0 : pos.acc });
  verifying = null;
  if (!res.ok) {
    track('checkin_failed', { reason: res.reason });
    renderPanel();
    return toast({ accuracy: `위치 정확도가 낮아요 (±${Math.round(pos ? pos.acc : 0)}m)\n하늘이 트인 곳에서 다시 측정해 주세요`, far: '아직 장소에서 멀어요\n조금 더 가까이 가 주세요', already: '이미 방문한 장소예요', not_started: '먼저 퀘스트를 시작해 주세요', unavailable: '지금은 방문할 수 없는 장소예요' }[res.reason] || '인증에 실패했어요. 다시 시도해 주세요');
  }
  reward(res);
}

// 서버 대역: 자격 검증 + 중복 방지(requestId·사용자+퀘스트) + 원자적 보상 지급
async function serverCheckin(req) {
  await sleep(700);
  if (S.processed[req.requestId]) return S.processed[req.requestId]; // 재전송은 같은 결과
  const q = S.quests[req.id];
  let res;
  if (!q) res = { ok: false, reason: 'not_started' };
  else if (q.status === 'completed') res = { ok: false, reason: 'already' };
  else if (isClosed(req.id)) res = { ok: false, reason: 'unavailable' };
  else if (!DEMO && req.acc > ACC_MAX) res = { ok: false, reason: 'accuracy' };
  else if (!DEMO && req.dist > radiusOf(req.id)) res = { ok: false, reason: 'far' };
  else res = grant(req.id);
  S.attempts.push({ id: uid(), quest: req.id, result: res.ok ? 'ok' : res.reason, acc: Math.round(req.acc), t: Date.now() }); // 좌표는 저장하지 않음
  S.attempts = S.attempts.slice(-50);
  const keys = Object.keys(S.processed); if (keys.length > 30) delete S.processed[keys[0]];
  S.processed[req.requestId] = res;
  save();
  return res;
}

function grant(id) {
  const L = S.lm[id], hidden = isHidden(id), before = levelOf(totalXp());
  const xp = hidden ? XP_HIDDEN : XP_VISIT; // 일반/히든 중 높은 보상 하나만
  S.quests[id] = Object.assign(S.quests[id], { status: 'completed', completedAt: Date.now() });
  S.collection[id] = Object.assign(S.collection[id] || {}, { discoveredAt: (S.collection[id] || {}).discoveredAt || Date.now(), completedAt: Date.now(), xp });
  S.ledger.push({ id: uid(), source_type: hidden ? 'hidden_spot' : 'landmark_checkin', source_id: id, xp, ts: Date.now() });
  const cid = cellId(L.lat, L.lng);
  const newCell = !S.cells[cid]; if (newCell) S.cells[cid] = Date.now();
  let bonus = 0;
  const reg = S.regions[L.region];
  if (reg && !reg.bonus && reg.targets.every(done)) { reg.bonus = true; bonus = XP_REGION; S.ledger.push({ id: uid(), source_type: 'region_complete', source_id: L.region, xp: bonus, ts: Date.now() }); }
  const after = levelOf(totalXp());
  return { ok: true, id, xp, bonus, hidden, newCell, levelUp: after > before ? after : null, region: L.region };
}

function nextRec(exceptId) {
  const arr = [...LM.values()].filter((L) => L.id !== exceptId && qstate(L.id) === 'Available' && !isHidden(L.id));
  arr.sort((a, b) => geo(from(), a) - geo(from(), b));
  return arr[0];
}

function reward(res) {
  const L = lm(res.id), nxt = nextRec(res.id), prog = regionProg(res.region);
  track('quest_completed', { hidden: res.hidden });
  track('xp_earned', { amount: res.xp + res.bonus });
  if (res.newCell) track('fog_cell_unlocked');
  if (res.hidden) track('hidden_spot_completed');
  drawMarkers(); drawFog(); renderAll();
  const steps = [
    ['✅', res.hidden ? '히든 스팟을 발견했어요!' : '방문 인증 완료!', L.name],
    ['⭐', `+${res.xp} XP${res.bonus ? ` · 지역 완성 보너스 +${res.bonus} XP` : ''}`, res.levelUp !== null ? `⬆️ 레벨 업! Lv.${res.levelUp + 1} ${lvTitle(res.levelUp)}` : `Lv.${levelOf(totalXp()) + 1} · 총 ${totalXp()} XP`],
    ['📖', res.hidden ? '특별 도감 카드를 획득했어요' : '도감에 등록됐어요', `${res.region} ${prog.done}/${prog.total}`],
    res.newCell ? ['🗺️', '새 구역이 해금됐어요', '안개가 걷혔어요'] : null,
    nxt ? ['🧭', '다음 추천 장소', `${nxt.name} · ${dist(geo(from(), nxt))}`] : null,
  ].filter(Boolean);
  modal(`<h2>${res.hidden ? '✨ 발견!' : '🎉 퀘스트 완료'}</h2>
    ${steps.map((s, i) => `<div class="step" style="animation-delay:${i * 0.4}s"><div class="si">${s[0]}</div><div><b>${esc(s[1])}</b><small>${esc(s[2])}</small></div></div>`).join('')}
    <div style="margin-top:16px;display:grid;gap:8px">${nxt ? `<button class="btn" data-act="select" data-id="${nxt.id}">다음 장소 보기</button>` : ''}
    <button class="btn ghost" data-act="close">${nxt ? '닫기' : '확인'}</button></div>`);
}

function regionProg(name) {
  const r = S.regions[name];
  if (!r) return { done: 0, total: 0, pct: 0 };
  const d = r.targets.filter(done).length;
  return { done: d, total: r.targets.length, pct: Math.round(d / r.targets.length * 100) };
}

function renderAll() { renderChrome(); renderPanel(); if (tab === 'collection') renderCollection(); if (tab === 'profile') renderProfile(); }
function renderChrome() { $('lvChip').textContent = `Lv.${levelOf(totalXp()) + 1} · ${totalXp()}XP`; }

  if (tab !== 'explore') return;
  if (view.name === 'list' && document.activeElement && ['q', 'dq'].includes(document.activeElement.id)) return; // 입력 중엔 다시 그리지 않음
  const sc = $('pscroll').scrollTop;
  const g0 = $('pscroll').querySelector('.gallery'), gl = g0 ? g0.scrollLeft : 0; // 위치 갱신으로 다시 그려도 사진 위치 유지

  else if (view.name === 'course' && courseOf(view.key)) {

}

// =====================================================================
// 도감 · 프로필
// =====================================================================
function collectionEntries() {
  const ids = new Set(); Object.values(S.regions).forEach((r) => r.targets.forEach((id) => ids.add(id)));
  Object.keys(S.collection).forEach((id) => ids.add(id));
  return [...ids].filter((id) => S.lm[id]).map((id) => {
    const c = S.collection[id] || {};
    return { id, L: S.lm[id], status: done(id) ? 'done' : (c.discoveredAt ? 'seen' : 'lock'), hid: isHidden(id), c };
  });
}

function renderCollection() {
  track('collection_viewed');
  const regs = Object.keys(S.regions).map((name) => ({ name, p: regionProg(name), bonus: S.regions[name].bonus }));
  let es = collectionEntries();
  const all = es.length;
  if (cfilt === 'seen') es = es.filter((e) => e.status === 'seen'); else if (cfilt === 'done') es = es.filter((e) => e.status === 'done');
  $('collection').innerHTML = `<div><h2>랜드마크 도감</h2>
    ${regs.length ? `<div class="prog">${regs.map((r) => `<div class="box"><b>${esc(r.name)}</b> <small>${r.p.done}/${r.p.total} 방문</small>${r.bonus ? ' <span class="bd bd-Completed">지역 완성 +300XP</span>' : ''}
      <div class="bar"><i style="width:${r.p.pct}%"></i></div><small>${r.p.pct}% · 모두 방문하면 +${XP_REGION}XP</small></div>`).join('')}</div>` : '<div class="empty"><b>아직 열린 지역이 없어요</b>탐험 지도에서 지역을 열면 수집 대상이 정해져요.</div>'}
    ${savedHTML()}
    <h3>수집 현황 <small>${all}곳</small></h3>
    <div class="chips">${[['all', '전체'], ['seen', '발견'], ['done', '방문 완료']].map((c) => `<button class="chip ${cfilt === c[0] ? 'on' : ''}" data-act="cfilt" data-id="${c[0]}">${c[1]}</button>`).join('')}</div>
    <div class="cgrid">${es.map(cardHTML).join('') || '<div class="empty" style="grid-column:1/-1">해당하는 장소가 없어요</div>'}</div></div>`;
}

function cardHTML(e) {
  const { L, status, hid, c, id } = e;
  if (status === 'lock') return `<div class="ccard lock ${hid ? 'hid' : ''}" data-act="cardinfo" data-id="${id}"><div class="cimg">${hid ? '❓' : '❔'}</div><b>???</b><small>${hid ? '히든 스팟' : CAT[L.catKey].label} · ${esc(L.region)}</small></div>`;
  const veil = hid && status !== 'done';
  return `<div class="ccard ${status} ${hid ? 'hid' : ''}" data-act="cardinfo" data-id="${id}"><div class="cimg">${veil ? '❓' : CAT[L.catKey].icon}</div>
    <b>${veil ? '히든 스팟' : esc(L.name)}</b><small>${status === 'done' ? `${hid ? '✨ 히든 · ' : ''}${fmtDate(c.completedAt)} · +${c.xp || xpOf(id)}XP` : '방문 전'}</small></div>`;
}

function cardInfo(id) {
  const L = S.lm[id], c = S.collection[id] || {}, st = done(id) ? 'done' : (c.discoveredAt ? 'seen' : 'lock'), hid = isHidden(id);
  if (st === 'lock') return modal(`<h2>${hid ? '❓ 히든 스팟' : '❔ 미발견 장소'}</h2><p class="sub">${hid ? '지도에서 신호를 찾아 힌트를 따라가 보세요.' : `${CAT[L.catKey].label} · ${esc(L.region)}`}<br>지도에서 장소를 발견하면 정보가 열려요.</p><button class="btn" data-act="tab" data-id="explore">탐험하러 가기</button>`);
  const veil = hid && st !== 'done';
  modal(`<h2>${veil ? '❓ 히든 스팟' : CAT[L.catKey].icon + ' ' + esc(L.name)}</h2>
    <p class="sub">${veil ? '아직 발견하지 못했어요' : `${CAT[L.catKey].label} · ${esc(L.region)}`}</p>
    <div class="stats"><div><b>${st === 'done' ? '방문 완료' : '발견'}</b><small>상태</small></div><div><b>${st === 'done' ? fmtDate(c.completedAt) : '-'}</b><small>최초 방문</small></div><div><b>${st === 'done' ? '+' + (c.xp || xpOf(id)) : '-'}</b><small>XP</small></div></div>
    <button class="btn" data-act="select" data-id="${id}">지도에서 보기</button>`);
}

const ACH = [
  { icon: '🥇', n: '첫 방문', d: '랜드마크 1곳 방문', ok: () => doneCount() >= 1 },
  { icon: '📚', n: '수집가', d: '랜드마크 5곳 방문', ok: () => doneCount() >= 5 },
  { icon: '✨', n: '히든 발견자', d: '히든 스팟 1곳 발견', ok: () => doneHidden() >= 1 },
  { icon: '🗺️', n: '지역 완성', d: '지역 도감 완성', ok: () => Object.values(S.regions).some((r) => r.bonus) },
  { icon: '🏅', n: '도시 발견자', d: 'Lv.3 달성', ok: () => levelOf(totalXp()) >= 2 },
];

function renderProfile() {
  const xp = totalXp(), n = levelOf(xp), cur = lvTh(n), nxt = lvTh(n + 1), pct = Math.round((xp - cur) / (nxt - cur) * 100);
  $('profile').innerHTML = `<div><h2>프로필</h2>
    <div class="box" style="margin-bottom:12px">${S.user ? `<b>${esc(S.user.nickname)}</b> <small>탐험가</small>` : `<b>게스트</b> <small>닉네임을 정하면 퀘스트 기록이 저장돼요</small><br><button class="chip" style="margin-top:8px" data-act="login">닉네임 정하기</button>`}</div>
    <div class="lvl"><div class="em">${['🌱', '🧭', '🗺️', '🏙️', '👑'][Math.min(n, 4)]}</div><div style="flex:1"><div class="t">Lv.${n + 1} ${lvTitle(n)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div><small>${xp} XP · 다음 레벨까지 ${nxt - xp}XP</small></div></div>
    <div class="grid4"><div><b>${doneCount()}</b><small>완료 퀘스트</small></div><div><b>${xp}</b><small>총 경험치</small></div><div><b>${Object.keys(S.cells).length}</b><small>해금 구역</small></div><div><b>${doneHidden()}</b><small>히든 발견</small></div></div>
    <h3>업적 <small>${ACH.filter((a) => a.ok()).length}/${ACH.length}</small></h3>
    <div class="ach">${ACH.map((a) => `<div class="${a.ok() ? '' : 'lock'}"><div class="ic">${a.icon}</div><b>${a.n}</b><small>${a.d}</small></div>`).join('')}</div>
    <h3>경험치 기록</h3><div class="box">${S.ledger.slice(-6).reverse().map((x) => `<div class="led"><span>${{ landmark_checkin: '랜드마크 방문', hidden_spot: '히든 스팟 발견', region_complete: '지역 도감 완성' }[x.source_type]}</span><b>+${x.xp} XP</b></div>`).join('') || '<small>아직 기록이 없어요. 첫 퀘스트에 도전해 보세요!</small>'}</div></div>`;
}

// =====================================================================
// 모달 · 설정 · 토스트
// =====================================================================
function modal(html) { $('mcard').innerHTML = `<button class="mx" data-act="close" aria-label="닫기">✕</button>` + html; $('modal').hidden = false; }
const closeModal = () => { $('modal').hidden = true; };
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3400);
}

function settingsModal() {
  modal(`<h2>설정</h2>
    <div class="setrow"><div><b>안개 효과</b><small style="display:block">끄면 표시만 바뀌고 해금 기록은 그대로예요</small></div><input type="checkbox" data-set="fog" ${S.settings.fog ? 'checked' : ''} style="width:24px;height:24px"></div>
    <div class="setrow"><div><b>애니메이션 줄이기</b></div><input type="checkbox" data-set="reduce" ${S.settings.reduce ? 'checked' : ''} style="width:24px;height:24px"></div>
    <div class="setrow"><div><b>탐색 반경</b></div><div class="chips" style="margin:0">${[1000, 3000, 5000].map((r) => `<button class="chip ${S.settings.radius === r ? 'on' : ''}" data-act="radius" data-id="${r}">${r / 1000}km</button>`).join('')}</div></div>
    <h3>위치 권한 안내</h3><p class="sub">위치는 체크인 순간의 거리 확인에만 쓰이고, 정확한 좌표는 저장하거나 분석에 보내지 않아요. 브라우저 설정에서 언제든 권한을 바꿀 수 있어요.</p>
    <h3>서비스 안내</h3><p class="sub">지도·장소 데이터는 Google Maps Platform 제공이에요. 이 프로토타입의 진행 기록은 이 브라우저에만 저장돼요.${ADMIN ? '<br>운영자 모드: 장소 상세에서 반경·비활성화·히든 지정이 가능해요.' : ''}</p>
    <button class="btn ghost" data-act="reset" style="margin-top:12px">탐험 기록 초기화</button>`);
}

// =====================================================================
// 탭 · 시트 · 이벤트
// =====================================================================
function setTab(t) {
  tab = t;
  document.querySelectorAll('[data-act=tab]').forEach((b) => { if (b.id !== 'lvChip' && b.closest('#tabs,#bnav')) b.classList.toggle('on', b.dataset.id === t); });
  $('collection').hidden = t !== 'collection'; $('profile').hidden = t !== 'profile';
  if (t === 'collection') renderCollection(); else if (t === 'profile') renderProfile(); else { renderPanel(); google.maps.event.trigger(map, 'resize'); }
}
const SHEETS = ['c', 'h', 'x'];
const setSheet = (s) => { document.body.dataset.sheet = s; };

function bindUi() {
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (t) act(t.dataset.act, t.dataset.id);
    else if (e.target === $('modal')) closeModal();
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target.id;
    if (f === 'rform') searchRegion($('q').value);
    if (f === 'dform') planRoute($('dq').value);
    if (f === 'lform') { $('landing').hidden = true; S.onboarded = true; save(); searchRegion($('lq').value); }
    if (f === 'loginform') {
      const nick = $('nick').value.trim();
      if (!nick) return;
      S.user = { id: uid(), nickname: nick }; save(); closeModal();
      const fn = afterLogin; afterLogin = null; if (fn) fn();
      renderAll();
    }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.set) {
      S.settings[t.dataset.set] = t.checked; save();
      document.body.classList.toggle('reduce', !!S.settings.reduce); drawFog();
    }
    if (t.dataset.ops) { // 운영자 장소 관리
      const id = t.dataset.id, o = (S.ops[id] = S.ops[id] || {});
      o[t.dataset.ops] = t.type === 'checkbox' ? t.checked : +t.value; save();
      drawMarkers(); drawFog(); renderAll();
    }
  });
  // 바텀시트: 탭하면 단계 순환, 위/아래로 밀면 한 단계씩
  let y0 = null;
  $('handle').addEventListener('pointerdown', (e) => { y0 = e.clientY; });
  $('handle').addEventListener('pointerup', (e) => {
    if (y0 === null) return;
    const dy = e.clientY - y0, i = SHEETS.indexOf(document.body.dataset.sheet); y0 = null;
    if (dy < -30) setSheet(SHEETS[Math.min(2, i + 1)]);
    else if (dy > 30) setSheet(SHEETS[Math.max(0, i - 1)]);
    else setSheet(SHEETS[(i + 1) % 3]);
  });
}

function act(a, id) {
  switch (a) {
    case 'start': $('landing').hidden = true; S.onboarded = true; save(); locate(); break;
    case 'tab': closeModal(); setTab(id); break;
    case 'settings': settingsModal(); break;
    case 'close': closeModal(); break;
    case 'select': closeModal(); selectLm(id); break;
    case 'back': view = { name: 'list' }; selId = null; refreshMarkerIcons(); if (!plan) routeLine.setPath([]); renderPanel(); break;
    case 'course': view = { name: 'course', key: id }; renderPanel(); break;
    case 'coursemap': showCourse(id); break;
    case 'routeClear': plan = null; routeLine.setPath([]); renderPanel(); break;
    case 'filt': filt = id; renderPanel(); break;
    case 'cfilt': cfilt = id; renderCollection(); break;
    case 'save': toggleSave(id); break;
    case 'quest': startQuest(id); break;
    case 'cancel': cancelQuest(id); break;
    case 'checkin': if (qstate(id) === 'Active') { (real || DEMO) ? toast('아직 장소에 도착하지 않았어요\n조금 더 가까이 가 주세요') : gateModal(); } else checkin(id); break;
    case 'gate': gateModal(); break;
    case 'gateGo': gateGo(); break;
    case 'step': stepGo(+id); break;
    case 'hint': revealHint(id); break;
    case 'gps': navigator.geolocation && navigator.geolocation.getCurrentPosition((p) => { setPos(p); renderPanel(); toast(`다시 측정했어요 (±${Math.round(p.coords.accuracy)}m)`); }, () => toast('위치를 다시 측정하지 못했어요'), { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }); break;
    case 'locate':
      if (real && pos) { map.panTo(pos); map.setZoom(16); }
      else locate(!!center).then(() => { if (real) { map.panTo(pos); map.setZoom(16); renderAll(); } else if (center) gateModal(true); });
      break;
    case 'filter': settingsModal(); break;
    case 'radius': S.settings.radius = +id; save(); closeModal(); if (center) loadLandmarks(); break;
    case 'alt': { const n = nextRec(id); n ? selectLm(n.id) : toast('추천할 장소가 아직 없어요\n반경을 넓혀 보세요'); break; }
    case 'cardinfo': cardInfo(id); break;
    case 'login': needLogin(renderAll); break;
    case 'reload': loadLandmarks(); break;
    case 'reset': if (confirm('탐험 기록을 모두 지울까요? 되돌릴 수 없어요.')) { localStorage.removeItem(KEY); location.reload(); } break;
  }
}
</script>

<script async defer onerror="mapFail()" src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap&libraries=places,geometry&language=ko&region=KR"></script>
</body>
